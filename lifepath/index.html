/* LifePath Arcade — classic orange/blue mobile life simulator theme.

:root{--green:#079f1a;--greenDark:#007c16;--lightGreen:#f2faeb;--paper:#fff;--line:#d8e0e7;--bg:#e9ecea;--ink:#314555;--muted:#688397;--blue:#005d9c;--red:#e93910;--purple:#954bd2;--gold:#ffcf29}

(()=>{'use strict';
const STORE='lifepath_save_v2';
const OLD_STORE='lifepath_save_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    const text=localStorage.getItem(STORE)||localStorage.getItem(OLD_STORE);

function achievement(id){if(!S.achievements.includes(id)){S.achievements.push(id);const names={graduation:'High School Graduate',degree:'University Graduate',job:'First Paycheck',rich:'Six Figures',love:'Love Story',parent:'Proud Parent',old:'A Life Well Lived'};log('🏆','Achievement unlocked',names[id]||id)}}
function makePerson(type, age){const name=pick(firstNames)+' '+pick(lastNames);return {id:'p'+(++S.ids),name,type,age:age??Math.max(0,S.age+rand(-3,3)),closeness:rand(53,82),alive:true}}
function newLife(name,gender,place){deadModal=false;S={name:name.trim().slice(0,30)||'Alex Rivera',gender,place,age:0,money:0,stats:{health:rand(76,99),happiness:rand(69,95),smarts:rand(35,80),looks:rand(40,90)},people:[],ids:0,job:null,jobYears:0,workFocus:false,degree:false,collegeEnd:null,actionsUsed:{},log:[],achievements:[],alive:true,married:false,children:0,assets:[],eventCount:0};S.people.push(makePerson('Mother',rand(25,39)),makePerson('Father',rand(25,42)));S.people[0].closeness=rand(70,95);S.people[1].closeness=rand(65,90);log('👶','A new life begins',`You were born in ${S.place}. Your story is yours to write.`);tab='life';menuOpen=false;eventModal=null;save();render()}
function adult(){return S.age>=18}
function school(){if(S.collegeEnd!==null&&S.age<S.collegeEnd)return 'University';if(S.age>=6&&S.age<=11)return 'Elementary School';if(S.age>=12&&S.age<=14)return 'Middle School';if(S.age>=15&&S.age<=17)return 'High School';return S.age>=18?'Finished school':'Not in school'}
function occupation(){return S.job?jobs.find(j=>j.id===S.job)?.name:'Unemployed'}
function salary(){const job=jobs.find(j=>j.id===S.job);return job?Math.round(job.salary*(1+Math.max(0,S.jobYears-1)*.055)):0}
function education(){return S.degree?'University Degree':S.age>=18?'High School Diploma':school()}
function stage(){return S.age<3?'Baby':S.age<13?'Child':S.age<18?'Teenager':S.age<30?'Young Adult':S.age<60?'Adult':'Senior'}
function avatar(){return S.age<3?'👶':S.age<13?'🧒':S.age<18?'🧑':S.age<60?'🙂':'👵'}
function consume(k){const n=S.actionsUsed[k]||0;if(n>=2){notice('You can only do this twice each year.',true);return false}S.actionsUsed[k]=n+1;return true}
function pay(cost){if(S.money<cost){notice(`You need ${cash(cost)} to do that.`,true);return false}S.money-=cost;return true}
function randomEvent(){const events=[];
if(S.age<=12)events.push({icon:'🎁',title:'A Surprise Gift',text:'A relative sends you birthday money. What will you do?',choices:[{text:'Save it for later',fn:()=>{S.money+=300;stat('happiness',3);log('🎁','Birthday money','You saved $300 for the future.')}},{text:'Buy something fun',fn:()=>{stat('happiness',9);log('🧸','New toy','You spent your gift money on something fun.')}}]});
if(S.age>=8&&S.age<=17)events.push({icon:'📝',title:'A Big Exam',text:'An important exam is coming up at school. How do you prepare?',choices:[{text:'Study all weekend',fn:()=>{stat('smarts',8);stat('happiness',-4);log('📝','Exam ace','All that studying paid off!')}},{text:'Just wing it',fn:()=>{stat('happiness',3);stat('smarts',-3);log('📝','A risky exam','You chose to relax instead of studying.')}}]});
if(S.age>=13)events.push({icon:'📱',title:'A Lost Phone',text:'You find a nice phone at the park. There is no one around.',choices:[{text:'Return it to its owner',fn:()=>{stat('happiness',7);log('📱','Good deed','You tracked down the owner, who thanked you.')}},{text:'Sell it for $400',fn:()=>{S.money+=400;stat('happiness',-6);log('📱','Easy money','You sold the phone. It did not feel quite right.')}}]});
if(S.age>=16)events.push({icon:'💰',title:'An Unexpected Opportunity',text:'Someone offers you a risky way to earn extra money.',choices:[{text:'Take the chance',fn:()=>{if(Math.random()<.53){S.money+=rand(1000,5500);log('💰','Lucky break','Your gamble paid off!')}else{S.money-=Math.min(Math.max(S.money,0),rand(400,3000));stat('happiness',-8);log('📉','A setback','The deal went wrong and you lost money.')}}},{text:'Play it safe',fn:()=>{stat('smarts',2);log('🧠','Safe choice','You decided not to take unnecessary risks.')}}]});
if(S.age>=18)events.push({icon:'🧳',title:'A Fresh Start',text:'You have a chance to attend a neighborhood festival this weekend.',choices:[{text:'Go and have some fun',fn:()=>{if(S.money>=300)S.money-=300;stat('happiness',9);log('🎡','A wonderful weekend','You enjoyed yourself and made some memories.')}},{text:'Stay home and recharge',fn:()=>{stat('health',3);stat('happiness',3);log('🏠','A quiet weekend','You enjoyed some peaceful time at home.')}}]});
if(S.age>=25)events.push({icon:'💸',title:'An Unexpected Bill',text:'An essential appliance breaks. You need to decide how to handle it.',choices:[{text:'Pay $1,400 for repairs',fn:()=>{S.money-=1400;stat('happiness',2);log('🔧','Problem solved','You paid to fix the appliance.')}},{text:'Make do for now',fn:()=>{stat('happiness',-8);stat('health',-2);log('🔧','Putting it off','The broken appliance is making life frustrating.')}}]});
if(S.age>=20)events.push({icon:'🐕',title:'A Stray Dog',text:'A friendly dog follows you home. What will you do?',choices:[{text:'Adopt it',fn:()=>{S.money-=500;stat('happiness',12);log('🐕','A furry companion','You gave the dog a loving home.')}},{text:'Help it find a shelter',fn:()=>{stat('happiness',5);log('🐾','A good home','You helped the dog find a safe new home.')}}]});
if(S.age>=40)events.push({icon:'❤️',title:'A Health Wake-Up Call',text:'Your doctor suggests you start taking better care of yourself.',choices:[{text:'Commit to a healthier lifestyle',fn:()=>{stat('health',11);stat('happiness',2);log('❤️','Turning over a new leaf','You made your health a priority.')}},{text:'Ignore the advice',fn:()=>{stat('health',-10);stat('happiness',3);log('🍕','Living in the moment','You ignored the advice and carried on as usual.')}}]});
if(S.age>=60)events.push({icon:'🌿',title:'What Matters Most?',text:'With so many years behind you, you reflect on what makes life meaningful.',choices:[{text:'Spend time with loved ones',fn:()=>{S.people.filter(p=>p.alive).forEach(p=>p.closeness=clamp(p.closeness+10));stat('happiness',10);log('🌿','Meaningful connections','You made time for the people you love.')}},{text:'Pursue a new hobby',fn:()=>{stat('happiness',10);stat('smarts',4);log('🎨','Never too late','You found a hobby that brings you joy.')}}]});
return events.length?pick(events):null}
function ageUp(){if(!S.alive||eventModal)return;tab='life';S.age++;S.actionsUsed={};
const lastSchool=S.age===6?'You started elementary school.':S.age===12?'You started middle school.':S.age===15?'You started high school.':null;
if(lastSchool)log('🏫','First day of school',lastSchool);
if(S.age===18){log('🎓','High school graduation','You graduated high school! Your next chapter begins.');achievement('graduation')}
if(S.collegeEnd!==null&&S.age>=S.collegeEnd){S.collegeEnd=null;S.degree=true;stat('smarts',11);log('🎓','University graduation','You earned your university degree.');achievement('degree')}
if(S.job){S.jobYears++;const earned=salary();S.money+=earned;let expense=S.age<18?1000:Math.round(12000+(S.age>28?(S.age-28)*420:0));if(S.children)expense+=S.children*3200;S.money-=expense;log('💵','A year at work',`You earned ${cash(earned)} as a ${occupation()} and paid ${cash(expense)} in living costs.`);if(S.workFocus){stat('happiness',-4);stat('smarts',2);if(Math.random()<.3){S.money+=2000;log('⭐','Work bonus','Your hard work earned a $2,000 bonus.')}}}else if(S.age>=18){const expense=Math.round(8500+(S.age>30?(S.age-30)*260:0)+S.children*2800);S.money-=expense;log('🏡','Living expenses',`Your yearly living costs came to ${cash(expense)}. Find a job to build up your finances.`)}
if(S.collegeEnd!==null&&S.age<S.collegeEnd){S.money-=11000;stat('smarts',rand(2,5));log('📚','University tuition','You paid $11,000 in tuition this year.')}
S.workFocus=false;
const decay=S.age>75?rand(4,9):S.age>60?rand(2,5):S.age>40?rand(0,3):rand(-2,2);
stat('health',-decay);stat('happiness',rand(-5,4));stat('smarts',S.age<18?rand(0,2):rand(-1,1));stat('looks',S.age>50?-rand(1,3):rand(-1,2));
for(const p of S.people){if(!p.alive)continue;p.age++;p.closeness=clamp(p.closeness+rand(-4,2));if(p.age>=77&&Math.random()<Math.min(.55,(p.age-70)*.027)){p.alive=false;stat('happiness',-13);log('🕯️','A difficult goodbye',`${p.name} passed away at age ${p.age}.`);if(p.type==='Partner'){S.married=false;p.type='Former partner'}}}
if(S.age===65)log('🌅','A milestone birthday','You reached 65 years old. What an incredible journey!');
if(S.age>=75)achievement('old');
if(S.money>=100000)achievement('rich');
if(S.stats.health<=0||S.age>=115||(S.age>75&&Math.random()<Math.pow((S.age-72)/120,1.55))){die();return}
if(Math.random()<.68){eventModal=randomEvent()}
if(!eventModal)log('🎂',`You turned ${S.age}`,pick(['Another year, another chapter.','A new year brings new possibilities.','The story of your life continues.']))
save();render()}
function die(){S.alive=false;log('🕊️','Your story ends',`You lived to age ${S.age}, leaving behind memories and a legacy.`);save();deadModal=true;render()}
function doAction(id){if(eventModal||!S.alive)return;const a=actions.find(a=>a.id===id);if(!a||S.age<a.min)return notice('You are not old enough yet.',true);if(id==='study'&&!(S.age>=6&&(S.age<18||S.collegeEnd!==null)))return notice('You need to be enrolled in school.',true);if(id==='date'&&S.people.some(p=>p.type==='Partner'&&p.alive))return notice('You are already in a relationship.',true);if(id==='baby'&&!S.people.some(p=>p.type==='Partner'&&p.alive))return notice('Find a partner first.',true);if((S.actionsUsed[id]||0)>=2)return notice('You can only do this twice per year.',true);if(a.cost&&!pay(a.cost))return;if(!consume(id))return;
switch(id){
case'read':stat('smarts',rand(2,6));stat('happiness',1);log('📚','Finished a book','You learned something new.');break;
case'gym':stat('health',rand(4,9));stat('looks',rand(1,4));stat('happiness',1);log('🏋️','A great workout','You worked up a sweat and felt stronger.');break;
case'relax':stat('happiness',rand(5,10));stat('health',2);log('🧘','Some peace and quiet','You took time to unwind.');break;
case'study':stat('smarts',rand(5,9));stat('happiness',-3);log('✏️','Studied harder','You put in the effort at school.');break;
case'doctor':stat('health',rand(9,19));log('🏥','Medical checkup','The doctor helped you feel better.');break;
case'gig':{const pay=rand(700,2500);S.money+=pay;stat('happiness',-2);log('💼','Side hustle',`You earned ${cash(pay)} doing odd jobs.`);break}
case'vacation':stat('happiness',rand(13,23));stat('health',3);log('🏖️','A vacation to remember','You made some wonderful memories.');break;
case'shopping':stat('happiness',rand(6,13));log('🛍️','Treat yourself','You bought something you have wanted for a while.');break;
case'social':{const p=makePerson('Friend',S.age);S.people.push(p);stat('happiness',5);log('🤝','A new friendship',`You became friends with ${p.name}.`);break}
case'date':{const p=makePerson('Partner',S.age+rand(-3,3));S.people.push(p);stat('happiness',12);log('💘','A new romance',`You started dating ${p.name}.`);break}
case'baby':{S.children++;const p=makePerson('Child',0);p.age=0;p.closeness=95;S.people.push(p);stat('happiness',14);log('🍼','A new addition',`Welcome to the world, ${p.name}!`);achievement('parent');break}
}
if(S.money>=100000)achievement('rich');save();render();notice('Action completed!')}
function applyJob(id){const j=jobs.find(j=>j.id===id);if(!j)return; if(S.age<j.age||S.stats.smarts<j.smart||(j.degree&&!S.degree))return notice('You do not meet the requirements.',true);S.job=id;S.jobYears=0;S.workFocus=false;log(j.icon,'You got the job!',`You were hired as a ${j.name}, starting at ${cash(j.salary)} per year.`);achievement('job');save();render();notice('Congratulations on your new job!')}
function jobAction(id){if(id==='quit'){S.job=null;S.jobYears=0;log('🚪','You resigned','You quit your job. Time for a new adventure.')}if(id==='work'){if(S.workFocus)return notice('You already worked hard this year.',true);S.workFocus=true;stat('happiness',-3);log('💼','Putting in the work','You made an extra effort at work.')}save();render()}
function college(){if(S.age<18||S.age>45||S.degree||S.collegeEnd!==null)return;if(S.stats.smarts<45)return notice('You need at least 45 smarts to enroll.',true);S.collegeEnd=S.age+4;S.money-=3000;stat('happiness',6);log('🎓','Off to university','You enrolled in a four-year degree program. Tuition is $11,000 per year.');save();render()}
function personAction(id,act){const p=S.people.find(p=>p.id===id);if(!p||!p.alive)return;const key='p:'+p.id+':'+act;if((S.actionsUsed[key]||0)>=2)return notice('You have already done this twice this year.',true);S.actionsUsed[key]=(S.actionsUsed[key]||0)+1;
if(act==='time'){p.closeness=clamp(p.closeness+rand(7,13));stat('happiness',3);log('💞','Quality time',`You spent time with ${p.name}.`)}
else if(act==='compliment'){p.closeness=clamp(p.closeness+rand(3,7));stat('happiness',1);log('💬','Kind words',`You complimented ${p.name}.`)}
else if(act==='marry'){if(p.type!=='Partner'||S.age<18||p.closeness<75||S.married)return;S.married=true;S.money-=3500;stat('happiness',16);log('💍','Wedding bells',`You married ${p.name}!`);achievement('love')}
else if(act==='breakup'){if(p.type!=='Partner')return;p.type='Ex-partner';S.married=false;stat('happiness',-15);log('💔','A breakup',`You and ${p.name} went your separate ways.`)}
save();render()}
function buyAsset(id){if(S.age<18)return;const asset=id==='car'?{id:'car',name:'Used Car',cost:12000,icon:'🚗'}:{id:'home',name:'Cozy House',cost:180000,icon:'🏠'};if(S.assets.some(a=>a.id===id))return notice('You already own this.',true);if(!pay(asset.cost))return;S.assets.push(asset);stat('happiness',9);log(asset.icon,'A big purchase',`You bought a ${asset.name.toLowerCase()} for ${cash(asset.cost)}.`);save();render()}
function careerTab(){const current=S.job?jobs.find(j=>j.id===S.job):null;return `<div class="stack page-enter"><div class="card"><div class="section-head"><h2>🎓 Education</h2><span class="tag">${esc(education())}</span></div><div class="detail-box"><strong>${S.collegeEnd!==null?'University student':S.degree?'University graduate':S.age>=18?'High school graduate':school()}</strong><p>${S.collegeEnd!==null?`You graduate in ${S.collegeEnd-S.age} year(s). Yearly tuition is $11,000.`:S.degree?'Your university degree qualifies you for advanced careers.':S.age>=18?'University is optional, but unlocks better jobs.':'Focus on studying and growing your smarts.'}</p></div>${S.age>=18&&S.age<=45&&!S.degree&&S.collegeEnd===null?`<button class="btn primary" data-college>Enroll in University · $3,000</button><p class="small-note">Requirements: 45+ smarts · 4 years · $11,000 annual tuition</p>`:''}</div><div class="card"><div class="section-head"><h2>💼 Current job</h2></div>${current?`<div class="list-card"><div class="list-emoji">${current.icon}</div><div class="list-main"><h3>${esc(current.name)}</h3><p>${cash(salary())}/year · ${S.jobYears} year(s) worked</p></div></div><div class="toggle-row" style="margin-top:15px"><button class="btn primary" data-job-action="work" ${S.workFocus?'disabled':''}>Work harder</button><button class="btn danger" data-job-action="quit">Resign</button></div>`:`<div class="empty"><div class="empty-icon">🧳</div>You are currently unemployed. Apply for a position below.</div>`}</div><div class="card"><div class="section-head"><h2>Available jobs</h2><span class="hint">${jobs.length} CAREERS</span></div><div class="listing">${jobs.map(j=>{const eligible=S.age>=j.age&&S.stats.smarts>=j.smart&&(!j.degree||S.degree);return `<div class="list-card"><div class="list-emoji">${j.icon}</div><div class="list-main"><h3>${esc(j.name)}</h3><p>${cash(j.salary)} / year · Age ${j.age}+${j.smart?', '+j.smart+' smarts':''}${j.degree?' · University degree':''}</p></div><div class="list-actions"><button class="btn ${eligible?'primary':'ghost'}" data-apply="${j.id}" ${!eligible||S.job===j.id?'disabled':''}>${S.job===j.id?'Current':eligible?'Apply':'Locked'}</button></div></div>`}).join('')}</div></div></div>`}
function relationshipTab(){const peeps=S.people.filter(p=>p.type!=='Ex-partner'&&p.type!=='Former partner');return `<div class="stack page-enter"><div class="card"><div class="section-head"><h2>❤️ Your people</h2><span class="hint">${peeps.filter(p=>p.alive).length} CONNECTIONS</span></div><p class="section-intro">Relationships grow when you invest time in them. Spend time together to improve closeness.</p><div class="listing">${peeps.length?peeps.map(p=>`<div class="list-card" style="align-items:flex-start"><div class="list-emoji">${p.type==='Mother'?'👩':p.type==='Father'?'👨':p.type==='Friend'?'🤝':p.type==='Child'?'🧒':'💘'}</div><div class="list-main"><h3>${esc(p.name)} ${p.type==='Partner'&&S.married?'💍':''}</h3><p>${p.alive?`${esc(p.type)} · Age ${p.age}`:'Deceased'} · Closeness ${p.closeness}%</p><div class="relation-bar"><div style="width:${p.closeness}%"></div></div></div>${p.alive?`<div class="list-actions"><button class="btn" data-person="${p.id}" data-act="time">Spend time</button><button class="btn ghost" data-person="${p.id}" data-act="compliment">Compliment</button>${p.type==='Partner'&&S.age>=18&&p.closeness>=75&&!S.married?`<button class="btn primary" data-person="${p.id}" data-act="marry">Get married</button>`:''}${p.type==='Partner'?`<button class="btn danger" data-person="${p.id}" data-act="breakup">Break up</button>`:''}</div>`:''}</div>`).join(''):'<div class="empty">No relationships yet.</div>'}</div></div><div class="card"><div class="section-head"><h2>Build new connections</h2></div><p class="section-intro">Meet new friends or look for romance from the Activities tab. Your network will grow over time.</p><button class="btn primary" data-goto="activities">Explore activities</button></div></div>`}
function activitiesTab(){return `<div class="stack page-enter"><div class="card"><div class="section-head"><h2>✨ Activities</h2><span class="hint">MAKE EVERY YEAR COUNT</span></div><p class="section-intro">Choose how to spend your time. Most activities can be done twice per year, then reset when you age up.</p><div class="actions">${actions.map(a=>{const locked=S.age<a.min||(a.id==='study'&&!(S.age>=6&&(S.age<18||S.collegeEnd!==null)))||(a.id==='date'&&S.people.some(p=>p.type==='Partner'&&p.alive))||(a.id==='baby'&&!S.people.some(p=>p.type==='Partner'&&p.alive));const max=(S.actionsUsed[a.id]||0)>=2;return `<button class="action-card" data-action="${a.id}" ${locked||max?'disabled':''}><div class="action-emoji">${a.icon}</div><div class="action-title">${esc(a.title)}</div><div class="action-desc">${esc(a.desc)}</div><div class="action-price ${locked?'locked':a.cost?'':'free'}">${max?'USED THIS YEAR':locked?'🔒 LOCKED · AGE '+a.min+'+':a.cost?cash(a.cost):'FREE'} ${!locked&&!max?`· ${2-(S.actionsUsed[a.id]||0)} LEFT`:''}</div></button>`}).join('')}</div></div></div>`}
function financesTab(){const yearly=salary(),expenses=S.age<18?0:Math.round((S.job?12000:8500)+(S.age>30?(S.age-30)*(S.job?420:260):0)+S.children*(S.job?3200:2800));const assetsVal=S.assets.reduce((n,a)=>n+a.cost,0);return `<div class="stack page-enter"><div class="money-hero"><div class="eyebrow">YOUR NET WORTH</div><div class="big">${cash(S.money+assetsVal)}</div><p>Your cash savings and property value combined.</p></div><div class="card"><div class="section-head"><h2>💵 Finances</h2></div><div class="mini-grid"><div class="metric"><div class="metric-label">Cash balance</div><div class="metric-value">${cash(S.money)}</div></div><div class="metric"><div class="metric-label">Yearly income</div><div class="metric-value">${cash(yearly)}</div></div><div class="metric"><div class="metric-label">Estimated living costs</div><div class="metric-value">${cash(expenses)}</div></div><div class="metric"><div class="metric-label">Asset value</div><div class="metric-value">${cash(assetsVal)}</div></div></div><p class="small-note">Income and living expenses settle whenever you age up. University tuition is additional.</p></div><div class="card"><div class="section-head"><h2>🏡 Life purchases</h2></div><div class="listing">${[{id:'car',name:'Used Car',cost:12000,icon:'🚗',desc:'A reliable ride for your everyday life.'},{id:'home',name:'Cozy House',cost:180000,icon:'🏠',desc:'A place to call your own.'}].map(a=>{const owned=S.assets.some(x=>x.id===a.id);return `<div class="list-card"><div class="list-emoji">${a.icon}</div><div class="list-main"><h3>${a.name}</h3><p>${a.desc} · ${cash(a.cost)}</p></div><div class="list-actions"><button class="btn ${owned?'ghost':'primary'}" data-buy="${a.id}" ${owned||S.age<18||S.money<a.cost?'disabled':''}>${owned?'Owned':'Buy'}</button></div></div>`}).join('')}</div></div></div>`}
function achievementsTab(){const items=[['graduation','🎓','High School Graduate','Finish high school'],['degree','📜','University Graduate','Earn a university degree'],['job','💼','First Paycheck','Get your first job'],['rich','💰','Six Figures','Save at least $100,000'],['love','💍','Love Story','Get married'],['parent','🍼','Proud Parent','Have a child'],['old','🌅','A Life Well Lived','Reach age 75']];return `<div class="stack page-enter"><div class="card"><div class="section-head"><h2>🏆 Milestones</h2><span class="hint">${S.achievements.length}/${items.length} UNLOCKED</span></div><div class="achievement-grid">${items.map(i=>`<div class="achievement ${S.achievements.includes(i[0])?'unlocked':''}"><div style="font-size:26px">${i[1]}</div><strong>${i[2]}</strong><span>${i[3]}</span></div>`).join('')}</div></div><div class="card"><div class="section-head"><h2>📜 Life history</h2></div>${feed(40)}</div></div>`}
function feed(limit){
  const logs=S.log.slice(0,limit).reverse();
  let previous=null;
  return `<div class="feed">${logs.map(i=>{
    const group=previous!==i.age; previous=i.age;
    return `${group?`<div class="timeline-year">Age: ${i.age} ${i.age===1?'year':'years'}</div>`:''}<p class="timeline-entry"><span class="timeline-emoji">${i.icon}</span><strong>${esc(i.title)}.</strong> ${esc(i.desc)}</p>`;
  }).join('')}</div>`;
}
function statsDock(){
  const stats=[['happiness','😆','Happiness'],['health','❤️','Health'],['smarts','💡','Smarts'],['looks','✨','Looks']];
  return `<div class="stats-dock" aria-label="Character statistics">${stats.map(t=>{
