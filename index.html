<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Realtime Text Share</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #333;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
    }
    #output {
      margin-top: 20px;
      padding: 15px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      min-height: 50px;
    }
  </style>
</head>
<body>
  <h1>Realtime Text Share</h1>
  <p>Type something below — it will show up in real time for others:</p>

  <textarea id="input" placeholder="Start typing..."></textarea>

  <div id="output"><em>Waiting for text...</em></div>

  <script>
    // Connect to WebSocket on same host (works on Render & locally)
    const socket = new WebSocket(
      (location.protocol === "https:" ? "wss://" : "ws://") + location.host
    );

    const input = document.getElementById("input");
    const output = document.getElementById("output");

    // Send text when typing
    input.addEventListener("input", () => {
      socket.send(input.value);
    });

    // Receive text from others
    socket.onmessage = (event) => {
      output.innerText = "Other person: " + event.data;
    };

    socket.onopen = () => {
      console.log("Connected to server ✅");
    };

    socket.onclose = () => {
      console.log("Disconnected from server ❌");
    };
  </script>
</body>
</html>
